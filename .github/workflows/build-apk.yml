name: Build Android APK

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "maestro/**"
      - "app/**"
      - "main.py"
      - "buildozer.spec"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev
          java -version
          python --version
      - name: Run test suite
        run: |
          python tests/test_env_integration.py
          python tests/test_heuristic_agent.py
          python tests/test_screen_perception.py
          python tests/test_frame_source.py
          python tests/test_execution_loop.py
          python tests/test_tactical_engine.py
          python tests/test_runtime_coordinator.py
          python tests/test_packaging.py
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34" buildozer
          buildozer --version
      - name: Clean previous Android build state
        run: rm -rf .buildozer bin
      - name: Build APK
        run: yes | buildozer -v android debug
      - name: Verify APK was produced
        run: |
          ls -lah bin/
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK_GERADO=$APK" >> "$GITHUB_ENV"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-grid-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
