name: Build Android APK

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "maestro/**"
      - "app/**"
      - "services/**"
      - "android_src/**"
      - "main.py"
      - "buildozer.spec"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Preparar ambiente Android
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          java -version
          python3 --version

      - name: Rodar testes do núcleo, IA, percepção e empacotamento
        run: |
          python3 tests/test_env_integration.py
          python3 tests/test_heuristic_agent.py
          python3 tests/test_screen_perception.py
          python3 tests/test_packaging.py

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --upgrade buildozer cython
          buildozer --version

      - name: Build do APK com Buildozer
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: |
          yes | buildozer -v android debug

      - name: Verificar APK gerado
        run: |
          ls -lah bin/
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK_GERADO=$APK"

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-grid-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
